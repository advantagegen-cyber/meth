<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meth Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--g:#4fae4f;--g2:#7dff7d;--line:#3a3a3a;--tx:#fff;--mut:#9a9a9a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100vh;}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 60px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px}
.tg{display:inline-flex;align-items:center;gap:12px;color:var(--tx);text-decoration:none;width:max-content}
.tg svg{width:34px;height:34px;transition:transform .25s}
.tg:hover svg{transform:translate(3px,-3px) rotate(-8deg)}
.tg b{display:block;font-size:1.35rem;font-weight:600}
.tg small{display:block;font-size:.72rem;color:var(--mut);margin-top:2px}
.tg:hover small{color:var(--g2)}
.brand{text-align:center}
.leaf{display:block;width:210px;max-width:60vw;height:auto;margin:0 auto;animation:drop 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.85)}to{opacity:1;transform:none}}
h1{margin:6px 0 8px;font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1}
h1 span{color:var(--g)}
.tag{margin:0;font-size:1.1rem}
.tag span{color:var(--g)}
.search{justify-self:end;display:flex;align-items:center;gap:12px;font-size:1.3rem}
.search input{width:190px;max-width:100%;background:transparent;border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--tx);font:inherit;font-size:.9rem;transition:border-color .2s,box-shadow .2s,width .3s}
.search input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(79,174,79,.25);width:230px}
hr{border:0;height:3px;margin:30px 0;background:#3a3a3a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 26px}
.card{display:flex;flex-direction:column;border:3px solid var(--line);border-radius:26px;overflow:hidden;color:var(--tx);text-decoration:none;position:relative;
transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;animation:in .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 600ms)}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--g);box-shadow:0 0 22px rgba(79,174,79,.35);outline:none}
.card[hidden]{display:none}
.top{flex:1;aspect-ratio:16/10;padding:14px 16px;position:relative;display:flex;align-items:flex-start;justify-content:space-between}
.diff{font-size:.85rem;display:flex;align-items:center;gap:10px}
.bot{border-top:3px solid var(--line);padding:16px 18px;text-align:center;font-size:.85rem;transition:border-color .3s}
.card:hover .bot{border-color:var(--g)}
.bot b{display:block;font-weight:600}
.bot span{color:var(--mut);font-size:.78rem}
.empty{display:none;text-align:center;color:var(--mut);margin-top:30px}
@media(max-width:700px){header{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1;grid-row:2}.search{grid-column:2;grid-row:1}.grid{grid-template-columns:1fr}.top{aspect-ratio:16/9}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:700;line-height:1.4}
.top{background-size:cover;background-position:center}
.top .pill{position:relative}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;backdrop-filter:blur(4px)}
.ov.open{display:flex;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#050505;border:3px solid var(--line);border-radius:26px;position:relative;animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
.box .x{position:absolute;top:12px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#000;color:#fff;font-size:1.1rem;cursor:pointer}
.box .x:hover{border-color:var(--g)}
.mimg{display:none;width:auto;max-width:100%;height:auto;max-height:65vh;margin:0 auto;object-fit:contain;background:#000;border-bottom:3px solid var(--line)}
.mbody{padding:22px 26px 28px}
.mbody h2{margin:12px 0 10px;font-size:1.6rem}
.mbody p{margin:0 0 20px;color:#ddd;line-height:1.6;white-space:pre-wrap}
.btn{display:inline-block;background:var(--g);color:#000;font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;text-decoration:none;cursor:pointer;transition:filter .2s}
.btn:hover{filter:brightness(1.15)}
.btn.red{background:#8f0f0f;color:#fff;padding:6px 12px;font-size:.8rem}
.adm{padding:26px}
.adm h2{margin:0 0 16px}
.adm label{display:block;margin:12px 0 5px;font-size:.85rem;color:var(--mut)}
.adm input,.adm select,.adm textarea{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;padding:10px 12px}
.adm textarea{min-height:90px;resize:vertical}
.adm input:focus,.adm select:focus,.adm textarea:focus{outline:none;border-color:var(--g)}
.adm .msg{margin-top:12px;font-size:.85rem;color:#f4c20d;min-height:1.2em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:-6px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:transparent;color:#bbb;font:inherit;font-size:.8rem;border:2px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.chip i{width:9px;height:9px;border-radius:50%}
.chip:hover{color:#fff;border-color:#666}
.chip.on{color:#fff;border-color:var(--g);background:rgba(79,174,79,.12)}
.count{font-size:.8rem;color:var(--mut)}
.top{position:relative;overflow:hidden}
.top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .top img{transform:scale(1.04)}
.bot{background:#070707;position:relative}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--g);transform:scaleX(0);transition:transform .35s}
.card:hover::after{transform:scaleX(1)}
header{padding-bottom:4px}
.tag{letter-spacing:.01em}
.grid.ready .card{animation:none}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:50px;padding-top:18px;border-top:3px solid #1e1e1e;font-size:.8rem;color:var(--mut)}
footer a{color:var(--g);text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="tg" href="https://t.me/Meth_Hub" target="_blank" rel="noopener" aria-label="Open Telegram">
    <svg viewBox="0 0 24 24" fill="#2aa3e8" aria-hidden="true"><path d="M21.9 3.3 2.6 10.7c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.1.8.7.8.4 0 .6-.2.9-.4l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.2c.3-1.3-.5-1.9-1.3-1.5ZM8.5 13.3l9.9-6.2c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4-2-4.7Z"/></svg>
    <span><b>Telegram</b><small>(For updates and support)</small></span>
  </a>
  <div class="brand">
    <img class="leaf" alt="Meth Hub logo" src="/leaf.png" width="210" height="194">
    <h1>METH <span>HUB</span></h1>
    <p class="tag">No meth here, only <span>methods.</span></p>
  </div>
  <label class="search">Search:
    <input id="q" type="search" autocomplete="off" aria-label="Search methods">
  </label>
</header>
<hr>
<main>
  <div class="bar"><div class="chips" id="chips"></div><span class="count" id="count"></span></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No methods match your search. Try a different word.</p>
</main>
<footer><span>© 2026 Meth Hub</span><a href="https://t.me/Meth_Hub" target="_blank" rel="noopener">Join us on Telegram</a></footer>
</div>
<div class="ov" id="mov"><div class="box" role="dialog" aria-modal="true"><button class="x" id="mx" aria-label="Close">✕</button><img class="mimg" id="mimg" alt=""><div class="mbody"><span class="pill" id="mpill"></span><h2 id="mt"></h2><p id="md"></p><a class="btn" href="https://t.me/Meth_Hub" target="_blank" rel="noopener">Get more on Telegram</a></div></div></div>
<div class="ov" id="aov"><div class="box adm" role="dialog" aria-modal="true"><button class="x" id="ax" aria-label="Close">✕</button>
<div id="gate"><h2>Admin access</h2><label for="pw">Access code</label><input id="pw" type="password" autocomplete="off"><div class="msg" id="gmsg"></div><p><button class="btn" id="unlock">Unlock</button></p></div>
<div id="panel" hidden><h2>Add a method</h2>
<label for="f-t">Title</label><input id="f-t" maxlength="80">
<label for="f-d">Difficulty</label><select id="f-l"><option>super easy</option><option>easy</option><option selected>medium</option><option>hard</option><option>super hard</option></select>
<label for="f-s">Short description (shown on the card)</label><input id="f-s" maxlength="140">
<label for="f-f">Full description (shown in the pop out)</label><textarea id="f-f"></textarea>
<label for="f-i">Image</label><input id="f-i" type="file" accept="image/*">
<div class="msg" id="pmsg"></div><p><button class="btn" id="save">Create method</button></p>
<h2 style="margin-top:26px">Existing methods</h2><div class="msg" id="lmsg"></div><div id="list"></div></div></div></div>
<script>
var COL={"super easy":["#a6f7a6","#000"],"easy":["#1f9d3a","#fff"],"medium":["#f4c20d","#000"],"hard":["#e5322d","#fff"],"super hard":["#8f0f0f","#fff"]};
var PH=["super easy","easy","medium","hard","super hard","medium"].map(function(d,i){return{ph:1,title:"Method "+(i+1),diff:d,desc:"Method "+(i+1)+" description (partial amount)",full:"Method "+(i+1)+" full description goes here."}});
var SHOW_PLACEHOLDERS=true; // set to false to hide the demo cards when there are no methods
var methods=[],grid=document.getElementById("grid"),q=document.getElementById("q"),empty=document.getElementById("empty"),dbp=null;
function $(i){return document.getElementById(i)}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pill(m,el){var c=COL[m.diff]||COL.medium;el.style.background=c[0];el.style.color=c[1];el.textContent=m.diff}
function imgUrl(m){return /^https:\/\//.test(m.img||"")?m.img:""}
function render(){var list=methods.length?methods:(SHOW_PLACEHOLDERS?PH:[]);grid.textContent="";
list.forEach(function(m,i){var a=h("a","card");a.href="#";a.style.setProperty("--i",i);a.dataset.t=(m.title+" "+m.diff+" "+m.desc).toLowerCase();a.dataset.d=m.diff;
var top=h("div","top"),u=imgUrl(m);if(u){var im=h("img");im.src=u;im.alt="";im.decoding="async";top.appendChild(im)}var p=h("span","pill");pill(m,p);top.appendChild(p);
var b=h("div","bot");b.appendChild(h("b",0,m.title));b.appendChild(h("span",0,m.desc));a.appendChild(top);a.appendChild(b);
a.addEventListener("click",function(e){e.preventDefault();openM(m)});grid.appendChild(a)});filter();if(!$("panel").hidden)renderList()}
var cur="all";
function filter(){var v=q.value.trim().toLowerCase(),n=0;grid.querySelectorAll(".card").forEach(function(c){var m=c.dataset.t.indexOf(v)>-1&&(cur==="all"||c.dataset.d===cur);c.hidden=!m;if(m)n++});empty.style.display=n?"none":"block";$("count").textContent=n+(n===1?" method":" methods")}
(function(){var c=$("chips");["all","super easy","easy","medium","hard","super hard"].forEach(function(k){var b=h("button","chip"+(k==="all"?" on":""),k==="all"?"All":k);b.type="button";if(COL[k]){var d=h("i");d.style.background=COL[k][0];b.insertBefore(d,b.firstChild)}
b.onclick=function(){cur=k;c.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x===b)});filter()};c.appendChild(b)})})();
q.addEventListener("input",filter);
function openM(m){var u=imgUrl(m);var mi=$("mimg");if(u){mi.src=u;mi.style.display="block"}else{mi.removeAttribute("src");mi.style.display="none"}pill(m,$("mpill"));$("mt").textContent=m.title;$("md").textContent=m.full||m.desc;$("mov").classList.add("open")}
function closeAll(){$("mov").classList.remove("open");$("aov").classList.remove("open")}
$("mx").onclick=$("ax").onclick=closeAll;
[$("mov"),$("aov")].forEach(function(o){o.addEventListener("click",function(e){if(e.target===o)closeAll()})});
async function api(u,o){o=o||{};o.cache="no-store";var r=await fetch(u,o),j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||("Request failed ("+r.status+")"));return j}
async function load(){try{methods=(await api("/api/methods")).methods||[]}catch(e){methods=[]}render()}
load();setTimeout(function(){grid.classList.add("ready")},1800);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll();if(e.shiftKey&&e.key==="F8"){e.preventDefault();openAdmin()}});
var ADMIN_LOGIN_API="/api/admin/login";
async function openAdmin(){$("aov").classList.add("open");try{if((await api(ADMIN_LOGIN_API)).admin){showPanel();return}}catch(e){}
if($("panel").hidden)setTimeout(function(){$("pw").focus()},50)}
function showPanel(){$("gate").hidden=true;$("panel").hidden=false;renderList()}
async function unlock(){try{await api(ADMIN_LOGIN_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("pw").value})});$("pw").value="";$("gmsg").textContent="";showPanel()}catch(e){$("gmsg").textContent=e.message;$("pw").select()}}
$("unlock").onclick=unlock;$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
function renderList(){var l=$("list");l.textContent="";if(!methods.length){l.appendChild(h("p","msg","No methods yet."));return}
methods.forEach(function(m){var r=h("div","row");r.appendChild(h("span",0,m.title));var d=h("button","btn red","Delete"),armed=0,tm;d.type="button";d.onclick=async function(){var lm=$("lmsg");
if(!armed){armed=1;d.textContent="Click again to confirm";tm=setTimeout(function(){armed=0;d.textContent="Delete"},3500);return}
clearTimeout(tm);d.disabled=true;d.textContent="Deleting...";lm.textContent="";
try{await api("/api/methods/"+encodeURIComponent(m.id),{method:"DELETE"});await load()}catch(e){armed=0;d.disabled=false;d.textContent="Delete";lm.textContent="Couldn't delete: "+e.message}};r.appendChild(d);l.appendChild(r)})}
$("save").onclick=async function(){var msg=$("pmsg"),t=$("f-t").value.trim(),s=$("f-s").value.trim();msg.textContent="";
if(!t||!s){msg.textContent="Add a title and a short description.";return}
var fd=new FormData();fd.append("title",t);fd.append("diff",$("f-l").value);fd.append("desc",s);fd.append("full",$("f-f").value.trim());var f=$("f-i").files[0];if(f)fd.append("image",f);
try{msg.textContent="Saving...";await api("/api/methods",{method:"POST",body:fd});["f-t","f-s","f-f","f-i"].forEach(function(k){$(k).value=""});msg.textContent="Method created.";await load()}catch(e){msg.textContent="Couldn't save: "+e.message}};
</script>
</body>
</html>
